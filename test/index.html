<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>SRD player test</title>
<style>
  :root{--black:#080808;--ink:#f2efe8;--canary:#fdf990;--mute:rgba(242,239,232,.6)}
  *{box-sizing:border-box}
  body{margin:0;background:var(--black);color:var(--ink);font:14px/1.5 Inter,system-ui,sans-serif;padding:24px 16px 60px}
  main{max-width:720px;margin:0 auto}
  h1{font:600 12px/1 Inter,system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:0 0 16px}
  .frame{position:relative;padding-top:56.25%;background:#000}
  .frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
  .stats div{border:1px solid #2b2a27;padding:10px;border-radius:4px}
  .stats b{display:block;font-size:22px;color:var(--canary);font-variant-numeric:tabular-nums}
  .stats span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
  pre{background:#121211;border:1px solid #2b2a27;border-radius:4px;padding:12px;font:12px/1.5 ui-monospace,Menlo,monospace;height:220px;overflow:auto;white-space:pre-wrap;margin:0}
</style>
</head>
<body>
<main>
  <h1>Player test · not public</h1>
  <div class="frame">
    <iframe id="v" src="https://player.vimeo.com/video/1198533142?title=0&byline=0&portrait=0&dnt=0"
      allow="autoplay; fullscreen; picture-in-picture; encrypted-media" allowfullscreen></iframe>
  </div>
  <div class="stats">
    <div><b id="status">loading</b><span>Player</span></div>
    <div><b id="watched">0s</b><span>Seconds watched</span></div>
    <div><b id="dur">-</b><span>Video length</span></div>
  </div>
  <pre id="log"></pre>
</main>
<script src="https://player.vimeo.com/api/player.js"></script>
<script>
  const log = (m) => { const el=document.getElementById('log'); el.textContent = new Date().toLocaleTimeString()+'  '+m+'\n'+el.textContent; };
  const $ = (id) => document.getElementById(id);
  const player = new Vimeo.Player($('v'));
  // Count real watched seconds: only add time that elapses during continuous playback (skips and seeks don't count).
  let watched = 0, last = null;
  player.ready().then(() => { $('status').textContent='ready'; log('player ready: the domain is allowed'); })
    .catch(e => { $('status').textContent='blocked'; log('player error: '+e.name+' '+e.message); });
  player.getDuration().then(d => $('dur').textContent = Math.round(d)+'s').catch(()=>{});
  player.on('play', d => { last = d.seconds; $('status').textContent='playing'; log('play at '+d.seconds.toFixed(1)+'s'); });
  player.on('pause', d => { last = null; $('status').textContent='paused'; log('pause at '+d.seconds.toFixed(1)+'s, watched '+Math.round(watched)+'s total'); });
  player.on('seeked', d => { last = d.seconds; log('seek to '+d.seconds.toFixed(1)+'s'); });
  player.on('ended', () => { last = null; $('status').textContent='ended'; log('ended, watched '+Math.round(watched)+'s total'); });
  player.on('timeupdate', d => {
    if (last !== null) { const step = d.seconds - last; if (step > 0 && step < 2) watched += step; }
    last = d.seconds; $('watched').textContent = Math.round(watched)+'s';
  });
  player.on('error', e => log('error: '+e.name+' '+(e.message||'')));
</script>
</body>
</html>
