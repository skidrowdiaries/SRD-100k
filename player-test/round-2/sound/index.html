<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Sound Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
  /* One question for a real iPhone: can our own button, with Vimeo's buttons switched off, ever get sound?
     This page has no tracker at all, so it cannot reach the viewer sheet. */
  :root { --ground: #0f0f0e; --black: #080808; --ink: #f2efe8; --muted: rgb(242 239 232 / 0.7); --canary: #fdf990; --canary-ink: #fdf98d; --body: "EB Garamond", Garamond, Georgia, serif; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--ground) url('../img/asphalt.webp') 0 0 / 512px 512px; color: var(--ink); font-family: var(--body); font-size: 20px; line-height: 1.35; -webkit-font-smoothing: antialiased; padding: calc(20px + env(safe-area-inset-top, 0px)) 16px calc(20px + env(safe-area-inset-bottom, 0px)); }
  h1 { margin: 0 0 6px; font-weight: 600; font-size: 30px; line-height: 1.12; color: var(--canary-ink); }
  p { margin: 0 0 14px; }
  .tests { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 16px 0; }
  .t { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .f { position: relative; aspect-ratio: 9 / 16; background: var(--black); overflow: hidden; }
  .f iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  button { font: inherit; font-weight: 600; font-size: 16px; line-height: 1; letter-spacing: 0.1em; text-transform: uppercase; color: var(--black); background: var(--canary); border: 0; min-height: 56px; width: 100%; padding: 0 4px; border-radius: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--canary); outline-offset: 2px; }
  .s { font-size: 16px; line-height: 1.2; color: var(--muted); min-height: 3.6em; }
  a { color: var(--canary-ink); display: inline-flex; align-items: center; min-height: 44px; }
</style>
</head>
<body>
<h1>Sound check</h1>
<p>Take your phone off silent and turn it up. Tap each number and listen for a few seconds. Number 3 takes a second tap.</p>
<div class="tests" id="tests"></div>
<p>Then tell me which numbers you could hear.</p>
<a href="../">Back to the row</a>

<script src="https://player.vimeo.com/api/player.js"></script>
<script>
  // Whitney's film, because it opens with a voice in the first two seconds. Vimeo's buttons are off on all three.
  const SRC = 'https://player.vimeo.com/video/1243884159?badge=0&autopause=0&title=0&byline=0&portrait=0&dnt=1&controls=0'
  const box = document.getElementById('tests')
  box.innerHTML = [1, 2, 3].map(n => `<div class="t"><div class="f"><iframe src="${SRC}" title="Sound check ${n}" allow="autoplay; fullscreen; picture-in-picture; encrypted-media" referrerpolicy="strict-origin-when-cross-origin"></iframe></div><button type="button">${n}</button><div class="s"></div></div>`).join('')
  const items = [...box.querySelectorAll('.t')].map(t => ({ player: new Vimeo.Player(t.querySelector('iframe')), btn: t.querySelector('button'), say: t.querySelector('.s') }))
  const quiet = fn => { try { const r = fn(); if (r && r.catch) r.catch(() => {}) } catch {} }
  const others = i => items.forEach((o, j) => { if (j !== i) quiet(() => o.player.pause()) })
  const unmute = p => { quiet(() => p.setMuted(false)); quiet(() => p.setVolume(1)) }
  const report = (it, wait = 1600) => setTimeout(async () => {
    try {
      const paused = await it.player.getPaused(), muted = await it.player.getMuted()
      it.say.textContent = paused ? 'Stopped' : muted ? 'Playing, muted' : 'Playing, sound on'
    } catch (e) { it.say.textContent = 'No reply' }
  }, wait)
  const start = it => it.player.play().catch(e => { it.say.textContent = e.name || 'Refused' })

  // 1: ask for sound first, then play, in the same tap.
  items[0].btn.addEventListener('click', () => { others(0); unmute(items[0].player); start(items[0]); report(items[0]) })
  // 2: play, then ask for sound a moment later, still inside the tap.
  items[1].btn.addEventListener('click', () => { others(1); start(items[1]); setTimeout(() => unmute(items[1].player), 300); report(items[1]) })
  // 3: play, then ask for sound on a second tap of its own.
  let armed = false
  items[2].btn.addEventListener('click', () => {
    others(2)
    if (!armed) { armed = true; start(items[2]); items[2].btn.textContent = 'Tap again'; report(items[2]) }
    else { unmute(items[2].player); items[2].btn.textContent = '3'; report(items[2], 900) }
  })
</script>
</body>
</html>
